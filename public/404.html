<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06223d">
<meta name="description" content="Island Pay — buy Island Pay credits securely. Pay · Shop · Book · Enjoy.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<link rel="preload" as="image" href="/assets/logo.webp">
<title>Island Pay — Pay · Shop · Book · Enjoy</title>
<style>
:root{--navy:#06223d;--ocean:#0a66b2;--tq:#19c3d6;--gold:#f5b82e;--bg:#f2f7fb;--card:#fff;--tx:#0b2540;--mut:#5d7690;--bd:#dde8f1;--bad:#c8433f;--ok:#12805c;box-sizing:border-box}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#071a2e;--card:#0e2a47;--tx:#eaf3fb;--mut:#8fb0cc;--bd:#1d4163}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:linear-gradient(180deg,#06223d,#0a66b2 60%,#19c3d6);min-height:100vh;color:var(--tx);font-family:Inter,"SF Pro Display",system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
.app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.hero{background:linear-gradient(160deg,#06223d,#0a66b2 70%,#19c3d6);padding:calc(14px + env(safe-area-inset-top,0px)) 20px 70px;position:relative;overflow:hidden;border-radius:0 0 32px 32px;color:#fff}
.hero img.logo{width:190px;display:block;position:relative;z-index:2}
.coins{position:absolute;right:14px;top:30px;width:120px;height:130px;perspective:500px;z-index:1}
.coin{position:absolute;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-size:30px;font-weight:800;transform-style:preserve-3d;animation:spin 7s linear infinite,float 4s ease-in-out infinite;box-shadow:inset 0 0 0 4px rgba(255,255,255,.35),0 10px 24px rgba(0,0,0,.35)}
.coin.btc{background:radial-gradient(circle at 30% 30%,#ffe08a,#f5b82e 60%,#b7791f);color:#7a4a00;left:0;top:0}
.coin.usdt{background:radial-gradient(circle at 30% 30%,#7ff0e0,#19c3d6 60%,#0a7f8e);color:#05424b;right:0;top:56px;animation-delay:-2s,-1s;width:54px;height:54px;font-size:26px}
@keyframes spin{to{transform:rotateY(360deg)}}@keyframes float{50%{margin-top:-10px}}
@media(prefers-reduced-motion:reduce){.coin{animation:none}}
.bal{margin:-52px 16px 0;background:var(--card);border-radius:22px;padding:18px 20px;box-shadow:0 14px 40px rgba(6,34,61,.18);position:relative;z-index:3;border:1px solid var(--bd)}
.bal small{color:var(--mut);font-weight:600}.bal .n{font-size:36px;font-weight:800;letter-spacing:-1px}
.chip{display:inline-block;font-size:11px;font-weight:700;border-radius:12px;padding:3px 10px;background:#fff3d1;color:#8a5a00}.chip.s{background:#e3f6f9;color:#0a7f8e}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px}
.act{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px 4px;text-align:center;cursor:pointer;font-weight:700;font-size:12px;color:var(--tx);font-family:inherit}
.act b{display:grid;place-items:center;width:42px;height:42px;margin:0 auto 6px;border-radius:50%;background:linear-gradient(135deg,var(--ocean),var(--tq));color:#fff;font-size:18px}.act.g b{background:linear-gradient(135deg,#f5b82e,#e89a10)}
h2{font-size:17px;margin:20px 16px 8px}.pad{padding:0 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin:0 16px 12px}
label{font-size:12px;font-weight:700;color:var(--mut);display:block;margin-top:10px}
input,select{width:100%;padding:13px;border:1px solid var(--bd);border-radius:12px;font:inherit;background:var(--card);color:var(--tx);margin-top:5px}
.btn{width:100%;border:0;border-radius:14px;padding:15px;font-weight:800;font-size:16px;color:#fff;background:linear-gradient(135deg,var(--ocean),var(--tq));cursor:pointer;margin-top:14px;font-family:inherit}.btn[disabled]{opacity:.5;cursor:not-allowed}.btn.gold{background:linear-gradient(135deg,#f5b82e,#e89a10);color:#3a2600}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:4px;gap:4px}.seg button{flex:1;border:0;background:none;padding:10px;border-radius:9px;font-weight:700;color:var(--mut);cursor:pointer;font-family:inherit}.seg button.on{background:var(--card);color:var(--ocean);box-shadow:0 2px 8px rgba(6,34,61,.1)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}
.note{background:#fff3d1;color:#6b4a00;border-radius:14px;padding:11px 14px;font-size:12px;margin:12px 16px}
.mut{color:var(--mut);font-size:13px}.ok{color:var(--ok)}.bad{color:var(--bad)}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:var(--card);border-top:1px solid var(--bd);display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));z-index:20}
nav a{flex:1;text-align:center;font-size:11px;font-weight:700;color:var(--mut);padding:6px 0;cursor:pointer}nav a i{display:block;font-style:normal;font-size:20px}nav a.on{color:var(--ocean)}

/* ===== Cinematic hero scene ===== */
.hero{height:360px;padding:env(safe-area-inset-top,0px) 0 0;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;border-radius:0 0 32px 32px;background:#06223d}
.hero img.logo{width:min(68%,310px);display:block;position:relative;z-index:6;margin-top:-34px;filter:drop-shadow(0 10px 26px rgba(0,0,0,.55))}
.scene{position:absolute;inset:0;overflow:hidden;pointer-events:none;background:linear-gradient(180deg,#0a3a72 0%,#1d78c2 30%,#8fd3ee 51%,#19c3d6 51.5%,#0a8fb5 74%,#06496f 100%)}
.sun{position:absolute;left:66%;top:24%;width:110px;height:110px;margin:-55px;border-radius:50%;background:radial-gradient(circle,#fff6d0 0,rgba(255,226,140,.8) 28%,rgba(255,200,90,0) 70%)}
.cl{position:absolute;left:0;height:22px;border-radius:30px;background:rgba(255,255,255,.7);filter:blur(1.2px);animation:cld 80s linear infinite;z-index:1}
.cl:before,.cl:after{content:"";position:absolute;background:inherit;border-radius:50%}.cl:before{width:42%;height:150%;left:14%;top:-70%}.cl:after{width:34%;height:120%;left:50%;top:-45%}
@keyframes cld{from{transform:translateX(-160px)}to{transform:translateX(calc(100vw + 40px))}}
.wv{position:absolute;left:0;width:200%;height:18%;animation:wvm 10s linear infinite;z-index:1}
.w1{bottom:44%;fill:rgba(255,255,255,.16)}.w2{bottom:29%;fill:rgba(255,255,255,.12);animation-duration:7s;animation-direction:reverse}.w3{bottom:12%;fill:rgba(4,40,70,.2);animation-duration:5s}
@keyframes wvm{to{transform:translateX(-50%)}}
.glint{position:absolute;left:58%;top:52%;width:90px;height:60px;background:radial-gradient(ellipse,rgba(255,240,190,.55),transparent 70%);animation:gl 3s ease-in-out infinite;z-index:1}
@keyframes gl{50%{opacity:.35;transform:scaleX(1.3)}}
.skw{position:absolute;left:0;z-index:2;width:98px}.s1{bottom:17%;animation:skL 15s linear infinite}.s2{bottom:6%;width:80px;filter:hue-rotate(150deg);animation:skR 19s linear infinite;animation-delay:-7s}
@keyframes skL{from{transform:translateX(-150px)}to{transform:translateX(calc(100vw + 40px))}}
@keyframes skR{from{transform:translateX(calc(100vw + 40px)) scaleX(-1)}to{transform:translateX(-150px) scaleX(-1)}}
.skb{animation:bob .7s ease-in-out infinite}.skb svg{display:block;width:100%;height:auto;filter:drop-shadow(0 4px 3px rgba(0,30,60,.35))}
@keyframes bob{50%{transform:translateY(-3px) rotate(-2deg)}}
.wk{position:absolute;left:-74px;bottom:1px;width:90px;height:6px;border-radius:6px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.75));filter:blur(1px)}
.sp{position:absolute;left:4px;bottom:3px;width:10px;height:10px;border-radius:50%;background:#fff;opacity:0;animation:puff .9s ease-out infinite}
@keyframes puff{0%{transform:translate(0,0) scale(.4);opacity:.9}100%{transform:translate(-48px,-14px) scale(1.7);opacity:0}}
.jetw{position:absolute;top:13%;left:0;width:200px;z-index:3;opacity:0;animation:jet 26s linear infinite}.jetw svg{display:block;width:100%;height:auto;filter:drop-shadow(0 8px 6px rgba(0,20,50,.35))}
.ct{position:absolute;right:94%;top:47%;width:200px;height:4px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.7));filter:blur(1.5px)}
@keyframes jet{0%{transform:translate(-260px,20px) scale(.75);opacity:0}4%{opacity:1}56%{transform:translate(calc(100vw + 60px),-34px) scale(1.15);opacity:1}60%,100%{transform:translate(calc(100vw + 60px),-34px) scale(1.15);opacity:0}}
.jsh{position:absolute;bottom:27%;left:0;width:150px;height:9px;z-index:1;opacity:0;background:radial-gradient(ellipse,rgba(3,40,70,.4),transparent 70%);animation:jsh 26s linear infinite}
@keyframes jsh{0%{transform:translateX(-200px);opacity:0}4%{opacity:.8}56%{transform:translateX(calc(100vw + 20px));opacity:.8}60%,100%{transform:translateX(calc(100vw + 20px));opacity:0}}
.scrim{position:absolute;inset:0;z-index:4;background:radial-gradient(ellipse 62% 50% at 50% 54%,rgba(6,34,61,.66),rgba(6,34,61,0) 72%),linear-gradient(180deg,rgba(6,34,61,.5),transparent 34%)}
.cn{position:absolute;z-index:5;width:var(--s);height:var(--s);perspective:700px;animation:flt var(--fd) ease-in-out infinite;filter:drop-shadow(0 10px 12px rgba(0,0,0,.4)) drop-shadow(0 0 14px var(--gl))}
.ci{position:relative;width:100%;height:100%;transform-style:preserve-3d;animation:cspin var(--sd) linear infinite;animation-delay:calc(var(--fd)*-.7)}
.ci span{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:calc(var(--s)*.52)}
.ci .f,.ci .b{backface-visibility:hidden}.ci .f{transform:translateZ(3px)}.ci .b{transform:rotateY(180deg) translateZ(3px)}
.ci .f:after,.ci .b:after{content:"";position:absolute;inset:0;border-radius:50%;background:linear-gradient(135deg,rgba(255,255,255,.6),rgba(255,255,255,0) 45%,rgba(0,0,0,.18))}
.btc{--gl:rgba(245,184,46,.7)}.btc .f,.btc .b{background:radial-gradient(circle at 30% 28%,#fff1b8,#f5b82e 55%,#a86b0a);color:#6b3f00;box-shadow:inset 0 0 0 4px rgba(255,255,255,.32),inset 0 -6px 10px rgba(120,70,0,.35)}.btc .m{background:#a86b0a}
.usdt{--gl:rgba(25,195,214,.75)}.usdt .f,.usdt .b{background:radial-gradient(circle at 30% 28%,#c9fbff,#19c3d6 55%,#07707f);color:#04424b;box-shadow:inset 0 0 0 4px rgba(255,255,255,.32),inset 0 -6px 10px rgba(0,60,70,.35)}.usdt .m{background:#07707f}
@keyframes cspin{to{transform:rotateY(360deg)}}@keyframes flt{50%{transform:translateY(-12px)}}
@media(max-width:560px){.hero{height:320px}.s2,.c3,.c4,.cl3,.jsh{display:none}}
@media(prefers-reduced-motion:reduce){.scene *,.cn,.ci{animation:none!important}.jetw{opacity:1;transform:translate(250px,-6px)}.skw{transform:translateX(60px)}.s2{transform:translateX(280px) scaleX(-1)}.sp,.wk,.jsh{display:none}}
/* ===== Island Pay platform additions ===== */
.app.wide{max-width:1120px}nav.wide{max-width:1120px}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:50;max-width:min(92vw,480px);padding:12px 16px;border-radius:14px;font-weight:700;font-size:14px;box-shadow:0 12px 30px rgba(6,34,61,.3);background:#0e2a47;color:#fff}
.toast.bad{background:var(--bad)}.toast.ok{background:var(--ok)}
.err{background:#fdecea;color:#8a1f1b;border-radius:12px;padding:10px 12px;font-size:13px;margin-top:10px;font-weight:600}.err:empty,.okbox:empty{display:none}
.okbox{background:#e3f6ee;color:#0b5a40;border-radius:12px;padding:10px 12px;font-size:13px;margin-top:10px;font-weight:600}
.spin{display:inline-block;width:16px;height:16px;border:2.5px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;animation:rot .8s linear infinite;vertical-align:-3px;margin-right:8px}
.spin.dk{border-color:rgba(10,102,178,.25);border-top-color:var(--ocean)}
@keyframes rot{to{transform:rotate(360deg)}}
.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.presets button{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:12px 4px;font-weight:800;font-family:inherit;cursor:pointer;font-size:15px}
.presets button.on{border-color:var(--ocean);background:rgba(10,102,178,.1);color:var(--ocean)}
.big{font-size:26px;font-weight:800;letter-spacing:-.5px}
.linkish{background:none;border:0;color:var(--ocean);font-weight:700;cursor:pointer;font-family:inherit;padding:8px 0;font-size:14px}
.btn.ghost{background:var(--card);color:var(--ocean);border:1px solid var(--bd)}.btn.bad{background:var(--bad)}
.btn.sm{width:auto;padding:8px 12px;font-size:12px;margin:4px 6px 0 0;border-radius:10px}
.pill{display:inline-block;font-size:11px;font-weight:800;border-radius:10px;padding:3px 9px;text-transform:uppercase;letter-spacing:.3px;background:#e8eef4;color:#4a6178}
.pill.succeeded,.pill.paid,.pill.sent,.pill.yes{background:#e3f6ee;color:#0b6a4a}.pill.pending,.pill.created,.pill.requested,.pill.approved,.pill.processing,.pill.skipped{background:#fff3d1;color:#8a5a00}
.pill.failed,.pill.rejected,.pill.review,.pill.reversed,.pill.refunded,.pill.expired,.pill.no{background:#fdecea;color:#a3261f}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:0 16px 12px}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px}.tile small{color:var(--mut);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.4px}.tile div{font-size:22px;font-weight:800;margin-top:4px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:14px 16px 10px;padding-bottom:4px}.tabs button{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--mut);border-radius:20px;padding:8px 14px;font-weight:700;cursor:pointer;font-family:inherit}.tabs button.on{background:var(--ocean);border-color:var(--ocean);color:#fff}
.tbl{width:100%;border-collapse:collapse;font-size:13px}.tbl th{text-align:left;color:var(--mut);font-size:11px;text-transform:uppercase;padding:8px 6px;border-bottom:1px solid var(--bd)}.tbl td{padding:9px 6px;border-bottom:1px solid var(--bd);vertical-align:top}
.scroll{overflow-x:auto}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;word-break:break-all}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:12px;font-size:13px;font-weight:600;color:var(--tx)}.chk input{width:auto;margin:2px 0 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.clk{cursor:pointer}
@media(max-width:420px){.two{grid-template-columns:1fr}.presets{grid-template-columns:repeat(2,1fr)}.acts{grid-template-columns:repeat(2,1fr)}}
@media print{nav,.hero,.noprint{display:none!important}body{background:#fff}.app{max-width:none;padding:0}.bal{margin:0;box-shadow:none}}
/* ===== Responsive full-page layout: phone · tablet · desktop ===== */
html,body{overflow-x:hidden}
nav a.brand{display:none}
.app,.app.wide{max-width:none;width:100%}
nav,nav.wide{max-width:none}
.app>:not(.hero){margin-left:max(16px,calc((100% - var(--cw,100%)) / 2));margin-right:max(16px,calc((100% - var(--cw,100%)) / 2))}
.app>h2{margin-left:max(16px,calc((100% - var(--cw,100%)) / 2))}
.app>.bal{margin-top:-52px}
.app>.acts,.app>.tabs{margin-top:16px}
#rv>*{margin-left:0;margin-right:0}
#rv>.card:first-child{margin-top:12px}
.hero{border-radius:0 0 clamp(24px,4vw,56px) clamp(24px,4vw,56px)}
/* Tablet / iPad */
@media(min-width:600px){
 .app{--cw:720px}.app.wide{--cw:1040px}
 .hero{height:400px}.hero img.logo{width:min(52%,360px)}
 .acts{gap:14px}.act{padding:18px 6px;font-size:13px}
 .bal{padding:24px 28px}
 .grid{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
 nav a{font-size:12px}
}
/* Desktop: top navigation bar, wide content */
@media(min-width:1024px){
 body{background:var(--bg)}
 .app{--cw:1080px;padding-bottom:48px;padding-top:68px}.app.wide{--cw:1240px}
 nav,nav.wide{top:0;bottom:auto;left:0;transform:none;width:100%;height:68px;align-items:center;gap:6px;padding:0 max(24px,calc((100% - 1240px) / 2));border-top:0;border-bottom:1px solid var(--bd);background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 4px 24px rgba(6,34,61,.08)}
 nav a{flex:none;display:flex;align-items:center;gap:8px;font-size:14px;padding:10px 16px;border-radius:12px;text-decoration:none}
 nav a i{display:inline;font-size:16px}
 nav a:hover{background:rgba(10,102,178,.08);color:var(--ocean)}
 nav a.on{background:rgba(10,102,178,.12)}
 nav a.brand{display:flex;margin-right:auto;padding:4px 0}nav a.brand:hover{background:none}
 nav a.brand img{height:44px;width:auto;display:block}
 .hero{height:min(520px,62vh);min-height:420px}.hero img.logo{width:min(36%,440px)}
 .bal{padding:28px 36px}.bal .n{font-size:48px}.big{font-size:34px}
 .acts{grid-template-columns:repeat(4,1fr);gap:18px}.act{padding:22px 8px;font-size:14px}.act b{width:52px;height:52px;font-size:22px}
 .act:hover,.presets button:hover,.tile:hover{border-color:var(--ocean);transform:translateY(-2px);box-shadow:0 10px 24px rgba(6,34,61,.1)}
 .act,.presets button,.tile{transition:transform .15s,box-shadow .15s,border-color .15s}
 h2{font-size:20px;margin-top:32px}
 .card{padding:22px 26px}
 .presets{grid-template-columns:repeat(6,1fr)}
 .btn{max-width:420px}.bal .btn,.card .btn{display:block}
 .btn.sm{max-width:none}
 .tbl{font-size:14px}
}
/* Large desktop */
@media(min-width:1440px){.app{--cw:1200px}.app.wide{--cw:1400px}nav,nav.wide{padding:0 max(32px,calc((100% - 1400px) / 2))}}
@media print{.app>:not(.hero){margin-left:0;margin-right:0}nav a.brand{display:none}}
</style>
</head>
<body>
<div class="app" id="app"><noscript><p style="padding:24px">Island Pay requires JavaScript.</p></noscript></div>
<nav id="nav"></nav>
<div id="toast" class="toast" hidden></div>
<script type="module" src="/app.js"></script>
</body>
</html>
